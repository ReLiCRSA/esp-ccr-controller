; Bench tool, its own project so it can never be confused with the controller
; build: pio run -d handset/bridge_esp32 -t upload
[platformio]
src_dir = .

[env:bridge]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11
; This bench board's USB bridge chip drives EN but not IO0, so download mode
; needs the BOOT button held by hand. A long connect window means you can press
; it whenever convenient instead of racing the tool: esptool pulses reset on
; every attempt, and the chip enters the bootloader on the first attempt where
; IO0 is low.
upload_flags =
    --connect-attempts=200
    --baud=115200

; The same sketch on the ESP32-S3, standing in for the classic bridge board
; while it is out of the drawer (2026-11-28). One board one port: flash it
; through the native USB path, explicitly —
;   pio run -d handset/bridge_esp32 -e bridge_s3 -t upload --upload-port /dev/ttyACM0
; and hw_accept talks to it over the UART bridge side: --handset /dev/ttyACM1.
;
; memory_type is NOT decoration: it is the fix found on metal for this module.
; The no-PSRAM default profile boot-looped on `assert failed: do_core_init
; startup.c:328 (flash_ret == ESP_OK)` and the mask ROM said why: `Octal Flash
; Mode Enabled` — the module's flash (and its 16 MB embedded PSRAM) are wired
; octal, so the quad-flash default could not initialise the flash the image
; lives on. Same finding as handset/example_esp32_handset/platformio.ini; the
; two envs must agree or one of them boot-loops.
[env:bridge_s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = opi_opi
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11
; Probed on 2026-11-27: both of this board's USB paths (native USB-Serial-JTAG
; and the UART bridge) entered download mode on their own, so no BOOT race —
; but the long connect window stays, it costs nothing.
upload_flags =
    --connect-attempts=200
    --baud=115200
