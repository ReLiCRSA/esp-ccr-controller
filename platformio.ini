[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
build_unflags =
    -std=gnu++11

; Fault-injection test build: SensorTask stalls 7 s at t=8 s to prove the
; supervisor restarts the MCU and the next boot comes up in SAFE mode.
[env:esp32_stalltest]
extends = env:esp32
build_flags =
    -std=gnu++17
    -Wall
    -DTEST_SENSOR_STALL
