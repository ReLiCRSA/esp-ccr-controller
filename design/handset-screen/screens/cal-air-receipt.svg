<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 172" width="320" height="172" role="img" aria-labelledby="t-cal-air-receipt d-cal-air-receipt"><title id="t-cal-air-receipt">AIR CAL · receipt only, code 0</title><desc id="d-cal-air-receipt">CAL AIR -&gt; OK CAL AIR | GET CALAIR -&gt; CALAIR,0,0,0,0,0,0,0,0</desc><style>text{font-family:'DejaVu Sans','Noto Sans','Helvetica Neue',Arial,sans-serif;letter-spacing:.4px;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1,'lnum' 1}.f44{font-size:44px;font-weight:600;letter-spacing:-.5px}.f26{font-size:26px;font-weight:600;letter-spacing:-.3px}.f16{font-size:16px;font-weight:600}.f13{font-size:13px;font-weight:500}.f11{font-size:11px;font-weight:500}.f11n{font-size:11px;font-weight:500}.f13s{font-size:13px;font-weight:700}.f16s{font-size:16px;font-weight:700;letter-spacing:.2px}.bg{fill:#05080C}.panel{fill:#101A24}.track{fill:#16232F}.line{fill:#263645}.ink{fill:#EAF1F8}.dim{fill:#8DA2B4}.live{fill:#3ED0E6}.ok{fill:#35D6A0}.warn{fill:#FFB020}.crit{fill:#FF4B4B}.held{fill:#6D8397}.onfill{fill:#05080C}</style><rect x="0" y="0" width="320" height="172" fill="#05080C"/><text x="8" y="19" class="f16s ink" text-anchor="start">AIR CALIBRATION</text><text x="312" y="19" class="f11 dim" text-anchor="end">GET CALAIR</text><line x1="8" y1="25" x2="312" y2="25" stroke="#263645" stroke-width="1"/><text x="8" y="42" class="f16s held" text-anchor="start">NO CAL AIR SINCE POWER-UP</text><rect x="6" y="48" width="308" height="19" fill="#101A24" stroke="#3ED0E6" stroke-width="1"/><rect x="6" y="48" width="3" height="19" fill="#3ED0E6"/><text x="10" y="61" class="f11 dim" text-anchor="start">RECEIPT</text><text x="124" y="61" class="f13 live" text-anchor="start">OK CAL AIR</text><rect x="208.944" y="50.5" width="100.556" height="13" fill="#101A24" stroke="#FFB020" stroke-width="1"/><text x="213.444" y="61" class="f11 warn" text-anchor="start">NOT A VERDICT</text><text x="10" y="81" class="f11 dim" text-anchor="start">CODE</text><text x="148" y="81" class="f13 held" text-anchor="start">0</text><rect x="202.399" y="70.5" width="107.101" height="13" fill="#101A24" stroke="#6D8397" stroke-width="1"/><text x="206.899" y="81" class="f11 held" text-anchor="start">NO VERDICT YET</text><text x="10" y="101" class="f11 dim" text-anchor="start">RAW COUNTS</text><text x="148" y="101" class="f13 dim" text-anchor="start">— · — · —</text><text x="10" y="121" class="f11 dim" text-anchor="start">SPREAD</text><text x="148" y="121" class="f13 dim" text-anchor="start">—</text><text x="10" y="141" class="f11 dim" text-anchor="start">WARM-UP LEFT</text><text x="148" y="141" class="f13 dim" text-anchor="start">—</text><text x="8" y="152" class="f11 dim" text-anchor="start">CODE 0 IS NEVER A TICK · CALAIR, DECIDES</text><rect x="0" y="156" width="320" height="16" fill="#101A24"/><line x1="0" y1="156" x2="320" y2="156" stroke="#263645" stroke-width="1"/><text x="8" y="168" class="f13 ink" text-anchor="start">CTRL · OK CAL AIR</text><text x="312" y="168" class="f11 dim" text-anchor="end">HELD=HOME</text></svg>