<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="nt nd"><title id="nt">Three-button navigation state machine, ESP-CCR handset</title><desc id="nd">HUD is home. One press reaches three destinations: DOWN is deco detail, UP is the rail, ENTER is commands. The rail opens six rows, and settings nests once more to a depth-3 key editor and a depth-3 string key. ENTER held 1.5 seconds returns home from any screen inside the cyan box. Alarm, link loss and SAFE mode are controller-decided overlays that override navigation: while a critical FLAGS bit is set ENTER sends ACK on every screen, and no key dismisses a link loss.</desc><style>text{font-family:'DejaVu Sans','Noto Sans','Helvetica Neue',Arial,sans-serif;letter-spacing:.2px}</style><rect x="0" y="0" width="960" height="660" fill="#05080C"/><text x="16" y="26" font-size="15" fill="#EAF1F8" font-weight="700" text-anchor="start">THREE BUTTONS · EVERY STATE REACHABLE AND ESCAPABLE</text><text x="16" y="44" font-size="10" fill="#8DA2B4" text-anchor="start">UP · DOWN · ENTER. No back key, no home key, no touch, no keyboard. The only universal exit is ENTER held 1.5 s.</text><text x="16" y="60" font-size="10" fill="#8DA2B4" text-anchor="start">Nesting is capped at 3 and lists scroll instead of nesting, so the deepest leaf is 3 presses down and 2 presses back up.</text><rect x="16" y="84" width="210" height="452" fill="none" stroke="#FF4B4B" stroke-width="1" stroke-dasharray="5 3"/><text x="22" y="78" font-size="10" fill="#FF4B4B" font-weight="700" text-anchor="start">THESE OVERRIDE KEYS</text><rect x="24" y="100" width="194" height="44" fill="#FF4B4B" stroke="#FF4B4B" stroke-width="1"/><text x="32" y="117" font-size="12" fill="#05080C" font-weight="700" text-anchor="start">ALARM</text><text x="212" y="117" font-size="10" fill="#05080C" font-weight="700" text-anchor="end">D0</text><text x="32" y="132" font-size="10" fill="#05080C" text-anchor="start">critical bit in T, FLAGS</text><rect x="24" y="164" width="194" height="44" fill="#FF4B4B" stroke="#FF4B4B" stroke-width="1"/><text x="32" y="181" font-size="12" fill="#05080C" font-weight="700" text-anchor="start">LINK LOST</text><text x="212" y="181" font-size="10" fill="#05080C" font-weight="700" text-anchor="end">D0</text><text x="32" y="196" font-size="10" fill="#05080C" text-anchor="start">no line for over 3 s</text><rect x="24" y="228" width="194" height="44" fill="#FF4B4B" stroke="#FF4B4B" stroke-width="1"/><text x="32" y="245" font-size="12" fill="#05080C" font-weight="700" text-anchor="start">SAFE MODE</text><text x="212" y="245" font-size="10" fill="#05080C" font-weight="700" text-anchor="end">D0</text><text x="32" y="260" font-size="10" fill="#05080C" text-anchor="start">T, mode field says SAFE</text><text x="22" y="292" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="start">CONTROLLER DECIDES,</text><text x="22" y="304" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="start">NOT THE DIVER'S KEYS</text><text x="22" y="320" font-size="10" fill="#8DA2B4" text-anchor="start">LINK LOST clears only</text><text x="22" y="332" font-size="10" fill="#8DA2B4" text-anchor="start">when a line arrives</text><text x="22" y="344" font-size="10" fill="#8DA2B4" text-anchor="start">again. No key dismisses</text><text x="22" y="356" font-size="10" fill="#8DA2B4" text-anchor="start">it, on any screen.</text><text x="22" y="368" font-size="10" fill="#8DA2B4" text-anchor="start">SAFE leaves only by its</text><text x="22" y="380" font-size="10" fill="#8DA2B4" text-anchor="start">own restart: ACK here</text><text x="22" y="392" font-size="10" fill="#8DA2B4" text-anchor="start">means RESTART, not</text><text x="22" y="404" font-size="10" fill="#8DA2B4" text-anchor="start">silence.</text><text x="22" y="416" font-size="10" fill="#8DA2B4" text-anchor="start">ALARM clears when the</text><text x="22" y="428" font-size="10" fill="#8DA2B4" text-anchor="start">FLAGS bit clears. No</text><text x="22" y="440" font-size="10" fill="#8DA2B4" text-anchor="start">handset latch, so a</text><text x="22" y="452" font-size="10" fill="#8DA2B4" text-anchor="start">stuck sensor stops</text><text x="22" y="464" font-size="10" fill="#8DA2B4" text-anchor="start">alarming by itself.</text><text x="22" y="490" font-size="10" fill="#FF4B4B" font-weight="700" text-anchor="start">WHILE A CRITICAL BIT</text><text x="22" y="504" font-size="10" fill="#8DA2B4" text-anchor="start">IS SET ON T, FLAGS:</text><text x="22" y="516" font-size="10" fill="#FF4B4B" text-anchor="start">ENTER = ACK, ANY SCREEN</text><g transform="translate(40,0)"><rect x="356" y="84" width="188" height="44" fill="#101A24" stroke="#3ED0E6" stroke-width="1"/><text x="364" y="101" font-size="12" fill="#EAF1F8" font-weight="700" text-anchor="start">HUD · HOME</text><text x="538" y="101" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="end">D0</text><text x="364" y="116" font-size="10" fill="#8DA2B4" text-anchor="start">STANDBY AUTO MANUAL</text><text x="356" y="78" font-size="10" fill="#3ED0E6" text-anchor="start">DEPTH and ppO2 sit in the same two pixels always</text><path d="M 450 128 L 450 168" fill="none" stroke="#263645" stroke-width="1"/><path d="M 331 168 L 736 168" fill="none" stroke="#263645" stroke-width="1"/><rect x="246" y="196" width="170" height="44" fill="#101A24" stroke="#263645" stroke-width="1"/><text x="254" y="213" font-size="12" fill="#EAF1F8" font-weight="700" text-anchor="start">DECO DETAIL</text><text x="410" y="213" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="end">D1</text><text x="254" y="228" font-size="10" fill="#8DA2B4" text-anchor="start">stops · ceiling · CNS</text><rect x="440" y="196" width="184" height="44" fill="#101A24" stroke="#263645" stroke-width="1"/><text x="448" y="213" font-size="12" fill="#EAF1F8" font-weight="700" text-anchor="start">THE RAIL</text><text x="618" y="213" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="end">D1</text><text x="448" y="228" font-size="10" fill="#8DA2B4" text-anchor="start">6 rows, UP/DOWN scroll</text><rect x="648" y="196" width="176" height="44" fill="#101A24" stroke="#263645" stroke-width="1"/><text x="656" y="213" font-size="12" fill="#EAF1F8" font-weight="700" text-anchor="start">COMMANDS</text><text x="818" y="213" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="end">D1</text><text x="656" y="228" font-size="10" fill="#8DA2B4" text-anchor="start">9 commands, UP/DOWN</text><path d="M 331 168 L 331 196" fill="none" stroke="#263645" stroke-width="1"/><text x="331" y="162" font-size="10" fill="#263645" font-weight="700" text-anchor="middle">DOWN</text><path d="M 532 168 L 532 196" fill="none" stroke="#263645" stroke-width="1"/><text x="532" y="162" font-size="10" fill="#263645" font-weight="700" text-anchor="middle">UP</text><path d="M 736 168 L 736 196" fill="none" stroke="#263645" stroke-width="1"/><text x="736" y="162" font-size="10" fill="#263645" font-weight="700" text-anchor="middle">ENTER</text><rect x="232" y="182" width="684" height="330" fill="none" stroke="#3ED0E6" stroke-width="1" stroke-dasharray="5 3"/><path d="M 450 182 L 450 132" fill="none" stroke="#3ED0E6" stroke-width="1" stroke-dasharray="5 3"/><text x="238" y="530" font-size="10" fill="#3ED0E6" font-weight="700" text-anchor="start">INSIDE THIS BOX: ENTER HELD 1.5 s -&gt; HOME. Nothing else ever leaves a screen.</text><path d="M 532 240 L 532 282" fill="none" stroke="#263645" stroke-width="1"/><path d="M 255 282 L 627 282" fill="none" stroke="#263645" stroke-width="1"/><text x="238" y="258" font-size="10" fill="#8DA2B4" text-anchor="start">ENTER opens the row · UP/DOWN scroll it</text><text x="238" y="270" font-size="10" fill="#8DA2B4" text-anchor="start">HELD accelerates, so 10 rows is never 10 presses</text><rect x="196" y="306" width="118" height="44" fill="#101A24" stroke="#263645" stroke-width="1"/><text x="204" y="323" font-size="11" fill="#EAF1F8" font-weight="700" text-anchor="start">PRE-DIVE</text><text x="308" y="323" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="end">D2</text><text x="204" y="338" font-size="10" fill="#8DA2B4" text-anchor="start">run pass fail</text><rect x="320" y="306" width="118" height="44" fill="#101A24" stroke="#263645" stroke-width="1"/><text x="328" y="323" font-size="11" fill="#EAF1F8" font-weight="700" text-anchor="start">AIR CAL</text><text x="432" y="323" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="end">D2</text><text x="328" y="338" font-size="10" fill="#8DA2B4" text-anchor="start">warm-up 7/12</text><rect x="444" y="306" width="118" height="44" fill="#101A24" stroke="#263645" stroke-width="1"/><text x="452" y="323" font-size="11" fill="#EAF1F8" font-weight="700" text-anchor="start">CELLS</text><text x="556" y="323" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="end">D2</text><text x="452" y="338" font-size="10" fill="#8DA2B4" text-anchor="start">pulse · proof</text><rect x="568" y="306" width="118" height="44" fill="#101A24" stroke="#263645" stroke-width="1"/><text x="576" y="323" font-size="11" fill="#EAF1F8" font-weight="700" text-anchor="start">SYSTEM</text><text x="680" y="323" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="end">D2</text><text x="576" y="338" font-size="10" fill="#8DA2B4" text-anchor="start">src · radio</text><path d="M 255 282 L 255 306" fill="none" stroke="#263645" stroke-width="1"/><path d="M 379 282 L 379 306" fill="none" stroke="#263645" stroke-width="1"/><path d="M 503 282 L 503 306" fill="none" stroke="#263645" stroke-width="1"/><path d="M 627 282 L 627 306" fill="none" stroke="#263645" stroke-width="1"/><path d="M 441 282 L 441 356" fill="none" stroke="#263645" stroke-width="1"/><path d="M 375 356 L 501 356" fill="none" stroke="#263645" stroke-width="1"/><rect x="316" y="378" width="122" height="44" fill="#101A24" stroke="#263645" stroke-width="1"/><text x="324" y="395" font-size="11" fill="#EAF1F8" font-weight="700" text-anchor="start">SETTINGS</text><text x="432" y="395" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="end">D2</text><text x="324" y="410" font-size="10" fill="#8DA2B4" text-anchor="start">8 groups</text><rect x="442" y="378" width="118" height="44" fill="#101A24" stroke="#263645" stroke-width="1"/><text x="450" y="395" font-size="11" fill="#EAF1F8" font-weight="700" text-anchor="start">DIVE LOG</text><text x="554" y="395" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="end">D2</text><text x="450" y="410" font-size="10" fill="#8DA2B4" text-anchor="start">3 of 10</text><path d="M 375 356 L 375 378" fill="none" stroke="#263645" stroke-width="1"/><path d="M 501 356 L 501 378" fill="none" stroke="#263645" stroke-width="1"/><rect x="300" y="448" width="140" height="44" fill="#101A24" stroke="#263645" stroke-width="1"/><text x="308" y="465" font-size="11" fill="#EAF1F8" font-weight="700" text-anchor="start">KEY EDITOR</text><text x="434" y="465" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="end">D3</text><text x="308" y="480" font-size="10" fill="#8DA2B4" text-anchor="start">UP/DOWN change</text><rect x="562" y="448" width="148" height="44" fill="#101A24" stroke="#263645" stroke-width="1"/><text x="570" y="465" font-size="12" fill="#EAF1F8" font-weight="700" text-anchor="start">STRING KEY</text><text x="704" y="465" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="end">D3</text><text x="570" y="480" font-size="10" fill="#8DA2B4" text-anchor="start">AP_SSID · AP_PASS</text><path d="M 375 422 L 375 448" fill="none" stroke="#263645" stroke-width="1"/><path d="M 420 422 L 420 436 L 636 436 L 636 448" fill="none" stroke="#263645" stroke-width="1"/><text x="384" y="438" font-size="10" fill="#8DA2B4" text-anchor="start">numeric</text><text x="560" y="432" font-size="10" fill="#8DA2B4" text-anchor="start">string</text><rect x="700" y="306" width="182" height="44" fill="#101A24" stroke="#263645" stroke-width="1"/><text x="708" y="323" font-size="12" fill="#EAF1F8" font-weight="700" text-anchor="start">CONFIRM</text><text x="876" y="323" font-size="10" fill="#8DA2B4" font-weight="700" text-anchor="end">D2</text><text x="708" y="338" font-size="10" fill="#8DA2B4" text-anchor="start">armed 6 s, press again</text><path d="M 788 240 L 788 306" fill="none" stroke="#263645" stroke-width="1"/><text x="708" y="364" font-size="10" fill="#8DA2B4" text-anchor="start">ENTER again sends</text><text x="708" y="377" font-size="10" fill="#8DA2B4" text-anchor="start">HELD cancels the arm</text></g><path d="M 226 122 L 396 122" fill="none" stroke="#FF4B4B" stroke-width="1" stroke-dasharray="5 3"/><text x="230" y="116" font-size="10" fill="#FF4B4B" text-anchor="start">OVER ANY SCREEN</text><path d="M 16 570 L 944 570" fill="none" stroke="#263645" stroke-width="1"/><text x="16" y="590" font-size="11" fill="#EAF1F8" font-weight="700" text-anchor="start">PRESS BUDGET</text><text x="16" y="610" font-size="16" fill="#3ED0E6" font-weight="700" text-anchor="start">0</text><text x="36" y="610" font-size="10" fill="#8DA2B4" text-anchor="start">HUD · HOME</text><text x="248" y="610" font-size="16" fill="#3ED0E6" font-weight="700" text-anchor="start">1</text><text x="268" y="610" font-size="10" fill="#8DA2B4" text-anchor="start">DECO · RAIL · COMMANDS</text><text x="480" y="610" font-size="16" fill="#3ED0E6" font-weight="700" text-anchor="start">2</text><text x="500" y="610" font-size="10" fill="#8DA2B4" text-anchor="start">A RAIL ROW · CONFIRM</text><text x="712" y="610" font-size="16" fill="#3ED0E6" font-weight="700" text-anchor="start">3</text><text x="732" y="610" font-size="10" fill="#8DA2B4" text-anchor="start">ANY OF THE 36 KEYS</text><text x="16" y="632" font-size="10" fill="#8DA2B4" text-anchor="start">ACK while a critical bit is set: 1 press, from any screen. No key dismisses a link loss.</text><text x="16" y="646" font-size="10" fill="#8DA2B4" text-anchor="start">And the two numbers a diver reads mid-descent are always at 0 presses, at 44 px, in the same place.</text></svg>