<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ESP-CCR — Status</title>
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="status">
<main class="grid">
  <div class="card span2">
    <h2>Loop ppO₂</h2>
    <div class="big"><span id="ppo2">--</span> <small id="target">target --</small></div>
    <div id="flags" style="margin-top:.6rem">--</div>
  </div>
  <div class="card">
    <h2>Depth</h2>
    <div class="big" id="depth">--<small> m</small></div>
    <div class="sub" id="setpointline">setpoint --</div>
  </div>

  <div class="card span3">
    <h2>Cells</h2>
    <div class="cells">
      <div class="cell" id="c0"><b>Cell 1</b><div class="row"><span id="c0v">--</span><span id="c0h">100</span></div><div class="bar"><i id="c0b"></i></div></div>
      <div class="cell" id="c1"><b>Cell 2</b><div class="row"><span id="c1v">--</span><span id="c1h">100</span></div><div class="bar"><i id="c1b"></i></div></div>
      <div class="cell" id="c2"><b>Cell 3</b><div class="row"><span id="c2v">--</span><span id="c2h">100</span></div><div class="bar"><i id="c2b"></i></div></div>
    </div>
  </div>

  <div class="card">
    <h2>Decompression</h2>
    <div class="row"><span>NDL</span><b id="ndl">--</b></div>
    <div class="row"><span>Ceiling</span><b id="ceiling">--</b></div>
    <div class="row"><span>Deco total</span><b id="decototal">--</b></div>
    <div class="row"><span>CNS O₂</span><b id="cns">--</b></div>
  </div>
  <div class="card span2">
    <h2>Deco ladder</h2>
    <table id="ladder"><tr><td class="sub">no deco obligation</td></tr></table>
  </div>

  <div class="card span3">
    <h2>System</h2>
    <div class="row"><span>Battery</span><b id="batt">--</b></div>
    <div class="row"><span>Solenoid</span><b id="inj">idle</b></div>
    <div class="row"><span>Events (last 5)</span><b id="evts">--</b></div>
  </div>
</main>
<script src="app.js"></script>
<script>
App.onChange(s => {
  const T = s.T, D = s.D;
  document.getElementById("ppo2").textContent = T ? T.voted.toFixed(2) : "--";
  document.getElementById("target").textContent = T ? `target ${T.sp.toFixed(2)}` : "target --";
  document.getElementById("depth").innerHTML = T ? `${T.depth.toFixed(1)}<small> m</small>` : "--";
  document.getElementById("setpointline").textContent = T ? `setpoint ${T.sp.toFixed(2)}` : "setpoint --";
  document.getElementById("flags").innerHTML = renderFlagPills(T, D);
  [0, 1, 2].forEach(i => {
    const v = T ? T.cells[i] : 0;
    document.getElementById(`c${i}v`).textContent = T ? v.toFixed(3) : "--";
    document.getElementById(`c${i}b`).style.width = Math.min(100, Math.max(0, v / 1.6 * 100)) + "%";
  });
  document.getElementById("ndl").textContent = D ? (D.ndl >= 480 ? "∞" : D.ndl + " min") : "--";
  document.getElementById("ceiling").textContent = D ? D.ceiling.toFixed(1) + " m" : "--";
  document.getElementById("decototal").textContent = D ? D.total.toFixed(1) + " min" : "--";
  document.getElementById("cns").textContent = D ? D.cns.toFixed(1) + " %" : "--";
  const lad = document.getElementById("ladder");
  lad.innerHTML = (D && D.stops.length)
    ? "<tr><th>Stop</th><th>Time</th></tr>" +
      D.stops.map(st => `<tr><td>${st.depth.toFixed(0)} m</td><td>${st.min.toFixed(1)} min</td></tr>`).join("")
    : '<tr><td class="sub">no deco obligation</td></tr>';
  const inj = T && (T.flags & 0b1000000) ? "INJECTING" : "idle";
  document.getElementById("inj").textContent = inj;
  document.getElementById("batt").textContent = "12.4 V";
  document.getElementById("evts").textContent = s.events.slice(-5).map(e => e.id).join(", ") || "--";
});
App.start();
</script>
</body>
</html>
