; Bench tool, its own project so it can never be confused with the controller
; build: pio run -d handset/bridge_esp32 -t upload
[platformio]
src_dir = .

[env:bridge]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11
; This bench board's USB bridge chip drives EN but not IO0, so download mode
; needs the BOOT button held by hand. A long connect window means you can press
; it whenever convenient instead of racing the tool: esptool pulses reset on
; every attempt, and the chip enters the bootloader on the first attempt where
; IO0 is low.
upload_flags =
    --connect-attempts=200
    --baud=115200
