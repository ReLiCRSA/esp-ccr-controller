<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 172" width="320" height="172" role="img" aria-labelledby="t-settings-group d-settings-group"><title id="t-settings-group">SETTINGS · SETPOINTS, mid-dive so dive-locked</title><desc id="d-settings-group">GET SCHEMA -&gt; K,SP1,F,0.200,1.600,3,0.400 | SET SP2=0.750 -&gt; ERR dive locked | GET * -> SP1=0.400 | SP2=0.700 | SP3=1.000 | SP4=1.300</desc><style>text{font-family:'DejaVu Sans','Noto Sans','Helvetica Neue',Arial,sans-serif;letter-spacing:.4px;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1,'lnum' 1}.f44{font-size:44px;font-weight:600;letter-spacing:-.5px}.f26{font-size:26px;font-weight:600;letter-spacing:-.3px}.f16{font-size:16px;font-weight:600}.f13{font-size:13px;font-weight:500}.f11{font-size:11px;font-weight:500}.f11n{font-size:11px;font-weight:500}.f13s{font-size:13px;font-weight:700}.f16s{font-size:16px;font-weight:700;letter-spacing:.2px}.bg{fill:#05080C}.panel{fill:#101A24}.track{fill:#16232F}.line{fill:#263645}.ink{fill:#EAF1F8}.dim{fill:#8DA2B4}.live{fill:#3ED0E6}.ok{fill:#35D6A0}.warn{fill:#FFB020}.crit{fill:#FF4B4B}.held{fill:#6D8397}.onfill{fill:#05080C}</style><rect x="0" y="0" width="320" height="172" fill="#05080C"/><rect x="0.5" y="0.5" width="319" height="171" fill="none" stroke="#6D8397" stroke-width="1"/><text x="8" y="19" class="f16s ink" text-anchor="start">SETPOINTS</text><text x="312" y="19" class="f11 dim" text-anchor="end">4 keys · flags 3</text><line x1="8" y1="25" x2="312" y2="25" stroke="#263645" stroke-width="1"/><text x="10" y="43" class="f11 dim" text-anchor="start">SP1</text><text x="148" y="43" class="f13 held" text-anchor="start">0.400</text><rect x="215.979" y="32.5" width="93.5206" height="13" fill="#101A24" stroke="#6D8397" stroke-width="1"/><text x="220.479" y="43" class="f11 held" text-anchor="start">SAFETY+LOCK</text><rect x="6" y="50" width="308" height="19" fill="#101A24" stroke="#3ED0E6" stroke-width="1"/><rect x="6" y="50" width="3" height="19" fill="#3ED0E6"/><text x="10" y="63" class="f11 dim" text-anchor="start">SP2</text><text x="148" y="63" class="f13 held" text-anchor="start">0.700</text><rect x="215.979" y="52.5" width="93.5206" height="13" fill="#101A24" stroke="#6D8397" stroke-width="1"/><text x="220.479" y="63" class="f11 held" text-anchor="start">SAFETY+LOCK</text><text x="10" y="83" class="f11 dim" text-anchor="start">SP3</text><text x="148" y="83" class="f13 held" text-anchor="start">1.000</text><rect x="215.979" y="72.5" width="93.5206" height="13" fill="#101A24" stroke="#6D8397" stroke-width="1"/><text x="220.479" y="83" class="f11 held" text-anchor="start">SAFETY+LOCK</text><text x="10" y="103" class="f11 dim" text-anchor="start">SP4</text><text x="148" y="103" class="f13 held" text-anchor="start">1.300</text><rect x="215.979" y="92.5" width="93.5206" height="13" fill="#101A24" stroke="#6D8397" stroke-width="1"/><text x="220.479" y="103" class="f11 held" text-anchor="start">SAFETY+LOCK</text><text x="10" y="123" class="f11 dim" text-anchor="start">RANGE</text><text x="148" y="123" class="f13 dim" text-anchor="start">0.200 – 1.600</text><rect x="316" y="30" width="3" height="119" fill="#16232F"/><rect x="316" y="30" width="3" height="119" fill="#3ED0E6"/><text x="8" y="152" class="f11 dim" text-anchor="start">GREYED = REFUSED MID-DIVE · STILL ON SCREEN</text><rect x="0" y="156" width="320" height="16" fill="#101A24"/><line x1="0" y1="156" x2="320" y2="156" stroke="#263645" stroke-width="1"/><text x="8" y="168" class="f13 crit" text-anchor="start">CTRL · ERR dive locked</text><text x="312" y="168" class="f11 dim" text-anchor="end">HELD=HOME</text></svg>