<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 172" width="320" height="172" role="img" aria-labelledby="t-confirm-dive-start d-confirm-dive-start"><title id="t-confirm-dive-start">DIVE START · second press required</title><desc id="d-confirm-dive-start">(nothing sent yet) · ENTER again sends DIVE START | DIVE START -&gt; OK DIVE</desc><style>text{font-family:'DejaVu Sans','Noto Sans','Helvetica Neue',Arial,sans-serif;letter-spacing:.4px;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1,'lnum' 1}.f44{font-size:44px;font-weight:600;letter-spacing:-.5px}.f26{font-size:26px;font-weight:600;letter-spacing:-.3px}.f16{font-size:16px;font-weight:600}.f13{font-size:13px;font-weight:500}.f11{font-size:11px;font-weight:500}.f11n{font-size:11px;font-weight:500}.f13s{font-size:13px;font-weight:700}.f16s{font-size:16px;font-weight:700;letter-spacing:.2px}.bg{fill:#05080C}.panel{fill:#101A24}.track{fill:#16232F}.line{fill:#263645}.ink{fill:#EAF1F8}.dim{fill:#8DA2B4}.live{fill:#3ED0E6}.ok{fill:#35D6A0}.warn{fill:#FFB020}.crit{fill:#FF4B4B}.held{fill:#6D8397}.onfill{fill:#05080C}</style><rect x="0" y="0" width="320" height="172" fill="#05080C"/><rect x="0.5" y="0.5" width="319" height="171" fill="none" stroke="#FFB020" stroke-width="1"/><text x="8" y="19" class="f16s ink" text-anchor="start">START DIVE · CONFIRM</text><text x="312" y="19" class="f11 dim" text-anchor="end">ARMED 6 s</text><line x1="8" y1="25" x2="312" y2="25" stroke="#263645" stroke-width="1"/><text x="8" y="48" class="f26 ink" text-anchor="start">PRESS ENTER AGAIN</text><rect x="8" y="54" width="304" height="6" fill="#16232F"/><rect x="8" y="54" width="228" height="6" fill="#FFB020"/><text x="8" y="72" class="f11 dim" text-anchor="start">ARM WINDOW 8 s · 2 s LEFT · NOTHING SENT</text><text x="10" y="91" class="f11 dim" text-anchor="start">LOG</text><text x="148" y="91" class="f13 ink" text-anchor="start">the dive file opens</text><text x="10" y="111" class="f11 dim" text-anchor="start">RADIO</text><text x="148" y="111" class="f13 held" text-anchor="start">intent off</text><rect x="259.036" y="100.5" width="50.464" height="13" fill="#101A24" stroke="#6D8397" stroke-width="1"/><text x="263.536" y="111" class="f11 held" text-anchor="start">POLICY</text><text x="10" y="131" class="f11 dim" text-anchor="start">EXIT</text><text x="148" y="131" class="f13 dim" text-anchor="start">HELD ENTER = HOME</text><text x="8" y="152" class="f11 dim" text-anchor="start">NOTHING SENT · LEAVING DROPS THE ARM</text><rect x="0" y="156" width="320" height="16" fill="#101A24"/><line x1="0" y1="156" x2="320" y2="156" stroke="#263645" stroke-width="1"/><text x="8" y="168" class="f13 warn" text-anchor="start">HANDSET · ARMED, NOT SENT</text><text x="312" y="168" class="f11 dim" text-anchor="end">HELD=HOME</text></svg>