<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 172" width="320" height="172" role="img" aria-labelledby="t-system-radio-held d-system-radio-held"><title id="t-system-radio-held">SYSTEM · radio intent on, radio actually down</title><desc id="d-system-radio-held">WIFI ON -&gt; OK | GET WIFI -&gt; WIFI,0,3,0,0</desc><style>text{font-family:'DejaVu Sans','Noto Sans','Helvetica Neue',Arial,sans-serif;letter-spacing:.4px;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1,'lnum' 1}.f44{font-size:44px;font-weight:600;letter-spacing:-.5px}.f26{font-size:26px;font-weight:600;letter-spacing:-.3px}.f16{font-size:16px;font-weight:600}.f13{font-size:13px;font-weight:500}.f11{font-size:11px;font-weight:500}.f11n{font-size:11px;font-weight:500}.f13s{font-size:13px;font-weight:700}.f16s{font-size:16px;font-weight:700;letter-spacing:.2px}.bg{fill:#05080C}.panel{fill:#101A24}.track{fill:#16232F}.line{fill:#263645}.ink{fill:#EAF1F8}.dim{fill:#8DA2B4}.live{fill:#3ED0E6}.ok{fill:#35D6A0}.warn{fill:#FFB020}.crit{fill:#FF4B4B}.held{fill:#6D8397}.onfill{fill:#05080C}</style><rect x="0" y="0" width="320" height="172" fill="#05080C"/><rect x="0.5" y="0.5" width="319" height="171" fill="none" stroke="#FFB020" stroke-width="1"/><text x="8" y="19" class="f16s ink" text-anchor="start">RADIO POLICY</text><text x="312" y="19" class="f11 dim" text-anchor="end">GET WIFI · poll 10 s</text><line x1="8" y1="25" x2="312" y2="25" stroke="#263645" stroke-width="1"/><text x="8" y="42" class="f16s warn" text-anchor="start">AP DOWN · HELD BY DEPTH</text><text x="10" y="61" class="f11 dim" text-anchor="start">INTENT (TYPED)</text><text x="124" y="61" class="f13 live" text-anchor="start">on · answered OK</text><rect x="6" y="68" width="308" height="19" fill="#101A24" stroke="#3ED0E6" stroke-width="1"/><rect x="6" y="68" width="3" height="19" fill="#3ED0E6"/><text x="10" y="81" class="f11 dim" text-anchor="start">ON · AP UP</text><text x="128" y="81" class="f13 warn" text-anchor="start">0</text><rect x="187.395" y="70.5" width="122.105" height="13" fill="#101A24" stroke="#FFB020" stroke-width="1"/><text x="191.895" y="81" class="f11 warn" text-anchor="start">TRANSPORT OBEYS</text><text x="10" y="101" class="f11 dim" text-anchor="start">HELD BY</text><text x="148" y="101" class="f13 warn" text-anchor="start">3</text><rect x="261.456" y="90.5" width="48.0444" height="13" fill="#101A24" stroke="#FFB020" stroke-width="1"/><text x="265.956" y="101" class="f11 warn" text-anchor="start">DEPTH</text><text x="10" y="121" class="f11 dim" text-anchor="start">IDLE LEFT</text><text x="128" y="121" class="f13 dim" text-anchor="start">0 s</text><rect x="221.229" y="110.5" width="88.2705" height="13" fill="#101A24" stroke="#6D8397" stroke-width="1"/><text x="225.729" y="121" class="f11 held" text-anchor="start">RADIO DOWN</text><text x="10" y="141" class="f11 dim" text-anchor="start">STATIONS</text><text x="148" y="141" class="f13 dim" text-anchor="start">0</text><text x="8" y="152" class="f11 dim" text-anchor="start">ON IS NOT WHAT YOU TYPED · HELD_BY 3 = DEPTH</text><rect x="0" y="156" width="320" height="16" fill="#101A24"/><line x1="0" y1="156" x2="320" y2="156" stroke="#263645" stroke-width="1"/><text x="8" y="168" class="f13 ink" text-anchor="start">CTRL · WIFI,0,3,0,0</text><text x="312" y="168" class="f11 dim" text-anchor="end">HELD=HOME</text></svg>