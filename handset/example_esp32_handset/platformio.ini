; Reference handset, its own project:
; pio run -d handset/example_esp32_handset -t upload
[platformio]
src_dir = .

[env:handset]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11

; The handset board as wired from 2026-11-27. Built for the S3 because the S3 is
; not a pin-compatible superset: see the pin block in the .ino, which is where
; the two maps live and why the classic map's 25/26/27/32/33 and 19 cannot be
; used there.
;
; The board id is the N8 / no-PSRAM profile, and its defaults were WRONG for
; this module — found on metal, not guessed. The first image flashed here boot
; looped on `assert failed: do_core_init startup.c:328 (flash_ret == ESP_OK)`,
; and the mask ROM said why: `Octal Flash Mode Enabled`. The ROM knows that only
; from eFuses, so this module's 32 MB flash is wired octal (OPI), and its 16 MB
; embedded PSRAM is octal too (esptool: `Embedded PSRAM 16MB (AP_1v8)`). The
; core's default variant assumes quad flash, so its second-stage loader could
; not initialise the flash the image lives on. memory_type below is the fix.
;
; The partition plan stays the 8 MB one deliberately: this firmware needs a
; fraction of that, and referencing the far end of a 32 MB part buys nothing
; except a new way to be wrong.
[env:handset_s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = opi_opi
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11
; Same reasoning as the bench bridge's ini: esptool pulses reset on every
; attempt, so the BOOT button can be pressed whenever convenient instead of
; racing the tool. Both of this board's USB paths (/dev/ttyACM0 native USB-JTAG
; and the UART bridge) entered download mode on their own when probed, which is
; how the chip was identified in the first place.
upload_flags =
    --connect-attempts=200
    --baud=115200
