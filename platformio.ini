[platformio]
default_envs = esp32
; The bench/handset sketches under handset/ are deliberately NOT environments
; here: they are their own one-file projects (each has a platformio.ini) built
; with `pio run -d handset/<name>`, so a stray handset build can never produce a
; controller image and the controller build never sees their sources.

[env:esp32]
platform = espressif32@6.12.0
board = esp32dev

; The firmware mounts LittleFS (LittleFS.begin in src/log/dive_store.cpp) on the
; partition labelled `spiffs` at 0x290000, 1 441 792 bytes. The name is the
; default partition table's, not the filesystem's. Declaring it matters if anyone
; ever does write that partition: with the default (SPIFFS) the image lands there
; unmountable, which was discovered on 2026-11-23 when the web page in data/ turned
; out never to have been installed (4219 bytes served against 25445 in the repo).
; Nothing needs writing there now — the page ships inside the app image, and the
; partition belongs to the dive logs: `uploadfs` erases dive history, so it is not
; part of the C2 gate (BENCH.md). The dive log formats the partition itself if the
; mount fails, and says so on the console.
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200
; Web stack, pinned for reproducible builds (PLAN 9). The registry names are
; the maintained ESP32Async forks; the old mathieucarbou/noiasfabiano URLs are
; dead. AsyncTCP is the transport under ESPAsyncWebServer — both are needed.
lib_deps =
    ESP32Async/AsyncTCP @ 3.6.1
    ESP32Async/ESPAsyncWebServer @ 3.12.1
lib_compat_mode = strict
lib_ldf_mode = chain
build_flags =
    -std=gnu++17
    -Wall
    ; AsyncTCP placement matters for a diver: the network task stays on core 0
    ; with the WiFi driver, so core 1 keeps control (prio 22) + handset + HUD,
    ; and the sensor task (prio 24, core 0) still preempts it. The stack is
    ; bigger than the default because dive exports run LittleFS reads and a
    ; 200 B CSV line on *this* task's stack.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    ; The async stack's default 5 s "unacked data" watchdog CLOSES the socket
    ; (AsyncWebSocket::_onTimeout -> close()). On a bench 2.4 GHz link, stalls
    ; over 5 s are routine - a laptop NIC scanning other channels does it on
    ; purpose - and that was the "NO DATA ... then the board closed us" cycle:
    ; every dashboard socket died at 30-70 s, on schedule. 30 s sheds truly
    ; dead clients; the page reconnects on its own backoff meanwhile.
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=30000
build_unflags =
    -std=gnu++11
; The PC system simulator (src/sim) is test scaffolding: it must never end up
; in the firmware image, so it is excluded here rather than by folder luck.
build_src_filter = +<*> -<sim/>

; Fault-injection test build: SensorTask stalls 7 s at t=8 s to prove the
; supervisor restarts the MCU and the next boot comes up in SAFE mode.
[env:esp32_stalltest]
extends = env:esp32
; Interpolated, not retyped: the AsyncTCP placement/stack flags must not drift
; away from the shipping build, or the fault-injection build tests a different
; task layout than the diver gets.
build_flags = ${env:esp32.build_flags} -DTEST_SENSOR_STALL

; ---------------------------------------------------------------------------
; Bench-only watchdog probes (BENCH.md, "The watchdog margin is a measured
; number"). Both stall SensorTask at t=8 s WITHOUT feeding TWDT, which is the
; difference from env:esp32_stalltest: that fixture keeps feeding on purpose, so
; it grades the supervisor and can never see the watchdog. Both also compile out
; the supervisor's heartbeat reboot, which otherwise wins the race at 1500 ms.
;
;   esp32_twdtmeasure — hud/control/uart2 are NOT subscribed, so the stalled
;       sensor task is the only subscription and the hardware countdown runs its
;       full period unchallenged. Measures stall -> panic.
;   esp32_twdtmask    — every task keeps its subscription, exactly like the
;       shipping build. esp_task_wdt_reset() feeds ONE hardware timer, so this
;       asks whether a healthy neighbour can re-arm it on a stalled task's
;       behalf, i.e. whether TWDT can see a stalled pinned task at all.
;
; Neither is ever the image a dive runs: leave the board on env:esp32.
; ---------------------------------------------------------------------------
[env:esp32_twdtmeasure]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DTEST_TWDT_PANIC

[env:esp32_twdtmask]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DTEST_TWDT_MASKED

; PC host for unit tests of hardware-free logic (voting, deco, ...).
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -pthread
build_src_filter = +<*> -<main.cpp> -<hud.cpp> -<sensors/ads1115_bus.cpp>
    -<comms/nvs_store.cpp> -<comms/uart2_task.cpp> -<comms/session_wiring.cpp>
    -<comms/web_server.cpp> -<log/dive_store.cpp> -<log/surface_store.cpp>
    -<log/continuity_store.cpp>
    ; The three LittleFS adapters need the filesystem. Everything the surface log
    ; decides — record format, CRC gate, capacity policy, CSV rows — is in
    ; log/divelog.cpp and is host-tested there; only the file calls live here.
    ; Dive continuity (H1) follows the same split on purpose: log/continuity.cpp
    ; (record format, CRC gate, the two-slot ordering, the surface-interval rule
    ; and the honesty sentences) is host-built and graded, and continuity_store.cpp
    ; is the file plumbing on top of it.
test_framework = unity
test_build_src = yes

; ---------------------------------------------------------------------------
; Optimizing-compiler gate for the deco view seqlock (REVIEW_BATCH_A m-4).
; Sources identical to env:native, all suites, only -O2 added: the compiler
; gets its chance to reorder the seqlock payload accesses across the seq
; updates — the hazard view.h's fences exist to forbid.
;
; MEASURED 2026-11-27 (x86-64, GCC 16.2.1; rebuilds verified by object-file
; timestamps, so every mutation really ran through the optimizer):
;   * Baseline green at both levels: 434/434 (35 suites) at -O0 and 434/434
;     at -O2, same day, same tree.
;   * Mutation: publishView's release fence commented out -> the torn-pair
;     test PASSES at -O0 AND at -O2. Same for viewSnapshot's acquire fence.
;   * Conclusion, and it is m-4's claim confirmed, not dodged: the gate has
;     NO TEETH against fence removal on x86. GCC lowers fetch_add(acq_rel)
;     to `lock xadd` — a full hardware barrier — and never sinks plain
;     loads/stores across atomic RMWs here, so the fences are redundant
;     instructions on this host. A host run can never demonstrate they are
;     load-bearing; only a weakly-ordered target (ESP32 HIL, ARM, or a tool-
;     chain that really sinks the writes) can prove that.
;   * What this env DOES prove, and why it stays a gate: the whole host suite
;     survives the optimizer — no UB that -O0 hides, no timing-grade case
;     (viewScalar budgets, seqlock reader liveness) that breaks under -O2.
; ---------------------------------------------------------------------------
[env:native_o2]
extends = env:native
; Interpolated, not retyped: the flags stay identical to env:native so the
; only difference this env grades is the optimization level. No test_filter:
; every suite env:native runs runs here too.
build_flags = ${env:native.build_flags} -O2
