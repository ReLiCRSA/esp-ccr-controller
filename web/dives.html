<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>ESP-CCR — Dives</title>
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="dives">
<main>
  <div class="card" style="margin-bottom:1rem">
    <h2>Last 10 dives</h2>
    <table id="list"><tr><td class="sub">no dives logged</td></tr></table>
  </div>
  <div class="card" id="detail" style="display:none">
    <h2 id="dtitle">Dive</h2>
    <canvas id="chart" width="900" height="260"></canvas>
    <div style="margin-top:.75rem;display:flex;gap:.5rem;flex-wrap:wrap">
      <button class="primary" id="csv">Download CSV</button>
    </div>
    <table id="dtabs" style="margin-top:1rem"></table>
  </div>
</main>
<script src="app.js"></script>
<script>
// Preview data; on the device these come from LOG LIST / LOG EXPORT rows.
const MOCK_DIVES = [
  { id: 3, date: "2026-11-20", dur: "52:10", max: 40.2, minpo2: 0.38, maxpo2: 1.31, cns: 61 },
  { id: 2, date: "2026-11-18", dur: "38:45", max: 29.9, minpo2: 0.41, maxpo2: 0.74, cns: 22 },
  { id: 1, date: "2026-11-15", dur: "61:02", max: 33.1, minpo2: 0.35, maxpo2: 0.90, cns: 40 },
];
function genSeries() {
  const pts = [];
  for (let t = 0; t <= 100; t += 30) {
    const d = t < 300 ? t / 300 * 40 : t < 2700 ? 40 : Math.max(0, 40 - (t - 2700) / 400 * 40);
    pts.push({ t, depth: d, po2: 0.4 + (d > 2 ? 0.3 : 0) + Math.random() * 0.02 });
  }
  return pts;
}
function drawChart(pts) {
  const c = document.getElementById("chart"), ctx = c.getContext("2d");
  ctx.clearRect(0, 0, c.width, c.height);
  const maxD = Math.max(...pts.map(p => p.depth)) + 5, n = pts.length;
  ctx.strokeStyle = "#8b98a5"; ctx.beginPath();
  pts.forEach((p, i) => { const x = i / (n - 1) * c.width, y = p.depth / maxD * (c.height - 20);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  ctx.strokeStyle = "#38bdf8"; ctx.beginPath();
  pts.forEach((p, i) => { const x = i / (n - 1) * c.width, y = c.height - 20 - p.po2 / 1.6 * (c.height - 40);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  ctx.fillStyle = "#8b98a5"; ctx.font = "11px system-ui";
  ctx.fillText("grey: depth   blue: ppO₂", 8, 14);
}
document.getElementById("list").innerHTML =
  "<tr><th>#</th><th>Date</th><th>Dur</th><th>Max</th><th>ppO₂ min/max</th><th>CNS</th></tr>" +
  MOCK_DIVES.map(d => `<tr onclick='show(${d.id})'><td>${d.id}</td><td>${d.date}</td><td>${d.dur}</td>
    <td>${d.max} m</td><td>${d.minpo2.toFixed(2)} / ${d.maxpo2.toFixed(2)}</td><td>${d.cns} %</td></tr>`).join("");
function show(id) {
  const d = MOCK_DIVES.find(x => x.id === id), pts = genSeries();
  document.getElementById("detail").style.display = "block";
  document.getElementById("dtitle").textContent = `Dive ${d.id} — ${d.date}`;
  document.getElementById("dtabs").innerHTML =
    `<tr><td>GF</td><td>30/85</td><td>Setpoints</td><td>0.40/0.70/1.00</td></tr>
     <tr><td>Cellproof</td><td>PASS @10 m</td><td>Events</td><td>3</td></tr>`;
  drawChart(pts);
  window._csv = "t_s,depth_m,ppo2\n" + pts.map(p => `${p.t},${p.depth.toFixed(2)},${p.po2.toFixed(3)}`).join("\n");
}
document.getElementById("csv").onclick = () => {
  const a = document.createElement("a");
  a.href = "data:text/csv," + encodeURIComponent(window._csv || "");
  a.download = "dive.csv"; a.click();
};
App.start();
</script>
</body>
</html>
