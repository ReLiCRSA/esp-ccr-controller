; Bench tool, its own project so it can never be confused with the controller
; build: pio run -d handset/bridge_esp32 -t upload
[platformio]
src_dir = .

[env:bridge]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11
