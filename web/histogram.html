<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>ESP-CCR — Histogram</title>
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="histogram">
<main>
  <div class="card" style="margin-bottom:1rem">
    <h2>Cell histogram — ppO₂ since power-on</h2>
    <p class="sub">Pre-dive tool: with clean air the three bars should pile up on
       one bin at 0.21. Spread, double humps or a lagging cell = replace it.</p>
    <div style="display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap">
      <button class="primary" onclick="App.send('CHECK')">Run pre-dive check</button>
      <button onclick="App.send('TEST CELLS')">Pulse-test cells</button>
    </div>
  </div>
  <div class="grid">
    <div class="card"><h2>Cell 1</h2><canvas id="h0" width="600" height="220"></canvas></div>
    <div class="card"><h2>Cell 2</h2><canvas id="h1" width="600" height="220"></canvas></div>
    <div class="card"><h2>Cell 3</h2><canvas id="h2" width="600" height="220"></canvas></div>
  </div>
</main>
<script src="app.js"></script>
<script>
function draw(canvas, bins) {
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const max = Math.max(1, ...bins);
  const bw = canvas.width / bins.length;
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  bins.forEach((v, i) => {
    const h = v / max * (canvas.height - 20);
    ctx.fillRect(i * bw + 1, canvas.height - h - 12, bw - 2, h);
  });
  ctx.fillStyle = "#8b98a5"; ctx.font = "11px system-ui";
  for (let p = 0; p <= 1.9; p += 0.5) {
    const x = p / 1.9 * canvas.width;
    ctx.fillText(p.toFixed(1), x, canvas.height - 2);
  }
}
App.onChange(s => { if (s.hist) s.hist.forEach((b, i) => draw(document.getElementById("h" + i), b)); });
App.start();
</script>
</body>
</html>
