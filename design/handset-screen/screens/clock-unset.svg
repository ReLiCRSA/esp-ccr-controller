<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 172" width="320" height="172" role="img" aria-labelledby="t-clock-unset d-clock-unset"><title id="t-clock-unset">WALL CLOCK · epoch 0 = no clock</title><desc id="d-clock-unset">GET TIME -&gt; TIME,0,0,0</desc><style>text{font-family:'DejaVu Sans','Noto Sans','Helvetica Neue',Arial,sans-serif;letter-spacing:.4px;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1,'lnum' 1}.f44{font-size:44px;font-weight:600;letter-spacing:-.5px}.f26{font-size:26px;font-weight:600;letter-spacing:-.3px}.f16{font-size:16px;font-weight:600}.f13{font-size:13px;font-weight:500}.f11{font-size:11px;font-weight:500}.f11n{font-size:11px;font-weight:500}.f13s{font-size:13px;font-weight:700}.f16s{font-size:16px;font-weight:700;letter-spacing:.2px}.bg{fill:#05080C}.panel{fill:#101A24}.track{fill:#16232F}.line{fill:#263645}.ink{fill:#EAF1F8}.dim{fill:#8DA2B4}.live{fill:#3ED0E6}.ok{fill:#35D6A0}.warn{fill:#FFB020}.crit{fill:#FF4B4B}.held{fill:#6D8397}.onfill{fill:#05080C}</style><rect x="0" y="0" width="320" height="172" fill="#05080C"/><rect x="0.5" y="0.5" width="319" height="171" fill="none" stroke="#6D8397" stroke-width="1"/><text x="8" y="19" class="f16s ink" text-anchor="start">WALL CLOCK</text><text x="312" y="19" class="f11 dim" text-anchor="end">GET TIME</text><line x1="8" y1="25" x2="312" y2="25" stroke="#263645" stroke-width="1"/><text x="160" y="74" class="f44 held" text-anchor="middle">NO CLOCK</text><text x="160" y="90" class="f11 dim" text-anchor="middle">EPOCH 0 · NOT 1970 · NEVER SET</text><text x="10" y="117" class="f11 dim" text-anchor="start">SOURCE</text><text x="148" y="117" class="f13 held" text-anchor="start">0 unset</text><rect x="224.788" y="106.5" width="84.712" height="13" fill="#101A24" stroke="#8DA2B4" stroke-width="1"/><text x="229.288" y="117" class="f11 dim" text-anchor="start">SET VIA WEB</text><text x="10" y="137" class="f11 dim" text-anchor="start">DIVE FILE</text><text x="126" y="137" class="f13 held" text-anchor="start">NO DATE</text><rect x="204.217" y="126.5" width="105.283" height="13" fill="#101A24" stroke="#FFB020" stroke-width="1"/><text x="208.717" y="137" class="f11 warn" text-anchor="start">UNDATED DIVES</text><text x="8" y="152" class="f11 dim" text-anchor="start">A DIVE STARTED NOW RECORDS NO DATE</text><rect x="0" y="156" width="320" height="16" fill="#101A24"/><line x1="0" y1="156" x2="320" y2="156" stroke="#263645" stroke-width="1"/><text x="8" y="168" class="f13 held" text-anchor="start">CTRL · TIME,0,0,0</text><text x="312" y="168" class="f11 dim" text-anchor="end">HELD=HOME</text></svg>